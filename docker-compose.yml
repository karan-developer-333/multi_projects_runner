version: '3.8'

services:
  project-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: project-runner-dev
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=development
      - PORT=10000
      - ENABLE_LOGGING=true
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
    networks:
      - project-runner-network

networks:
  project-runner-network:
    driver: bridge
